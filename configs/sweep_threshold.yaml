# W&B Sweep for Post-Training Threshold Tuning
# 
# Usage:
#   1. wandb sweep configs/sweep_threshold.yaml
#   2. wandb agent <sweep-id>
#
# WARNING: This runs inference multiple times (inefficient).
# Consider using scripts/threshold_sweep.py instead (6x faster).

program: scripts/threshold_sweep_wandb.py
method: grid

metric:
  name: val/f1
  goal: maximize

parameters:
  checkpoint:
    value: "~/data/emberformer/checkpoints/dino_phase2_expanding_best.pt"
  
  config:
    value: "configs/emberformer_dino_expanding.yaml"
  
  threshold:
    values: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75]
  
  gpu:
    value: 0
